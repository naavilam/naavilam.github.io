name: Audit (infra + GA)

on:
  workflow_dispatch:
    inputs:
      run_infra:
        description: "Run infra audit"
        type: boolean
        default: true
      run_ga:
        description: "Run GA usage audit"
        type: boolean
        default: false
      orgs:
        description: "Comma-separated orgs (leave empty to use default ORGS env)"
        type: string
        default: ""
  schedule:
    - cron: "17 3 * * *" # diário (UTC)

permissions:
  contents: write

env:
  ORGS: academic-codex,quantum-materials,high-energy,quantum-computing

jobs:
  audit_infra:
    if: ${{ github.event_name == 'schedule' || inputs.run_infra }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run infra audit
        env:
          ORGS: ${{ inputs.orgs != '' && inputs.orgs || env.ORGS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/org_audit.py

      - name: Upload reports artifact (infra)
        uses: actions/upload-artifact@v4
        with:
          name: reports-infra
          path: reports
          if-no-files-found: warn

  audit_ga:
    if: ${{ github.event_name == 'schedule' || inputs.run_ga }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install google-analytics-data

      - name: Run GA usage audit
        env:
          ORGS: ${{ inputs.orgs != '' && inputs.orgs || env.ORGS }}
          GA_CREDENTIALS_JSON: ${{ secrets.GA_CREDENTIALS_JSON }}

          GA_PROPERTY_ID_ACADEMIC_CODEX: ${{ vars.GA_PROPERTY_ID_ACADEMIC_CODEX }}
          GA_PROPERTY_ID_HIGH_ENERGY: ${{ vars.GA_PROPERTY_ID_HIGH_ENERGY_PHYSICS }}
          GA_PROPERTY_ID_NAAVILAM: ${{ vars.GA_PROPERTY_ID_NAAVILAM }}
          GA_PROPERTY_ID_QUANTUM_MATERIALS: ${{ vars.GA_PROPERTY_ID_QUANTUM_MATERIALS }}
          GA_PROPERTY_ID_QUANTUM_COMPUTING: ${{ vars.GA_PROPERTY_ID_QUANTUM_MATERIALS }} # intencional no momento
        run: |
          python .github/scripts/ga_audit_usage.py

      - name: Upload reports artifact (ga)
        uses: actions/upload-artifact@v4
        with:
          name: reports-ga
          path: reports
          if-no-files-found: warn

  commit_reports:
    if: ${{ always() && (needs.audit_infra.result != 'skipped' || needs.audit_ga.result != 'skipped') }}
    runs-on: ubuntu-latest
    needs: [audit_infra, audit_ga]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # importante pra conseguir trocar de branch

      - name: Download all reports artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: _reports_in
          merge-multiple: true

      - name: Checkout reports branch
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin reports || true

          if git ls-remote --exit-code --heads origin reports >/dev/null 2>&1; then
            git checkout reports
            git pull --ff-only origin reports
          else
            git checkout --orphan reports
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Sync reports to branch root
        shell: bash
        run: |
          set -euo pipefail

          # limpa tudo que estava na branch (pra remover arquivos antigos também)
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name "_reports_in" \
            -exec rm -rf {} +

          # copia o conteúdo novo para a RAIZ (sem --delete pra não matar .git)
          rsync -a "_reports_in/" "./"

          rm -rf _reports_in
          
          echo "== tree (reports branch) =="
          find . -maxdepth 3 -type f | sort || true

      - name: Commit & push (if changed)
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update reports"
          git push -u origin reports  
