  commit_reports:
    if: ${{ always() && (needs.audit_infra.result != 'skipped' || needs.audit_ga.result != 'skipped') }}
    runs-on: ubuntu-latest
    needs: [audit_infra, audit_ga]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # importante pra conseguir trocar de branch

      - name: Download all reports artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: _reports_in
          merge-multiple: true

      - name: Switch to reports branch (create if missing)
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin reports || true

          if git show-ref --verify --quiet refs/remotes/origin/reports; then
            git checkout -B reports origin/reports
          else
            git checkout --orphan reports
            git rm -rf . || true
          fi

      - name: Sync reports to branch root
        shell: bash
        run: |
          set -euo pipefail
          # limpa tudo que estava na branch (pra remover arquivos antigos também)
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name "_reports_in" \
            -exec rm -rf {} +

          # agora copia o conteúdo novo para a RAIZ
          rsync -a --delete "_reports_in/" "./"

          echo "== tree (reports branch) =="
          find . -maxdepth 3 -type f | sort || true

      - name: Commit & push (if changed)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update reports"
          git push origin reports