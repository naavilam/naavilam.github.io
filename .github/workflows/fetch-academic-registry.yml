name: Fetch Academic Registry

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/ref deste repo (onde vai commitar o _data/courses.yml)"
        required: false
        default: "main"
  schedule:
    - cron: "23 3 * * *" # diário (UTC)

permissions:
  contents: write

concurrency:
  group: "fetch-academic-registry"
  cancel-in-progress: true

env:
  DEST_FILE: "_data/courses.yml"

  REGISTRY_OWNER: "naavilam"
  REGISTRY_REPO: "github-infra-templates"
  REGISTRY_REF: "main"
  REGISTRY_PATH: "org/org_registry/academic-codex-registry.yml"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: ref
        shell: bash
        run: |
          ref="${{ inputs.ref }}"
          if [ -z "$ref" ]; then ref="main"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Download public registry (raw)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _tmp _data

          RAW_URL="https://raw.githubusercontent.com/${{ env.REGISTRY_OWNER }}/${{ env.REGISTRY_REPO }}/${{ env.REGISTRY_REF }}/${{ env.REGISTRY_PATH }}"
          echo "Fetching: $RAW_URL"

          curl -fsSL "$RAW_URL" -o "_tmp/academic-codex-registry.yml"
          test -s "_tmp/academic-codex-registry.yml"

      - name: Build _data/courses.yml from registry
        shell: bash
        env:
          DEST_FILE: ${{ env.DEST_FILE }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, yaml

          src = Path("_tmp/academic-codex-registry.yml")
          dst = Path(os.environ["DEST_FILE"])

          data = yaml.safe_load(src.read_text(encoding="utf-8")) or {}
          if not isinstance(data, dict):
              raise SystemExit("[fatal] registry: expected a YAML mapping at top level")

          registry_org = (data.get("org") or "").strip()  # ex: "academic-codex"
          repos = data.get("repos", [])
          if not isinstance(repos, list):
              raise SystemExit("[fatal] registry: key 'repos' must be a list")

          out = []
          for it in repos:
              if not isinstance(it, dict):
                  continue

              name = (it.get("name") or "").strip()
              if not name:
                  continue

              title = (it.get("title") or "").strip()
              course_id = (it.get("id") or "").strip()
              level = (it.get("academic_level") or "").strip()
              school = (it.get("academic_school") or "").strip()
              area = (it.get("academic_area") or "").strip()
              status = (it.get("status") or "").strip().lower()
              completed_on = (it.get("completed_on") or "").strip()

              # No novo formato, 'org' vem no topo (registry_org). Ainda aceitamos override por item se existir.
              item_org = (it.get("org") or "").strip() or registry_org

              # link padrão no seu esquema: https://{org}.github.io/{repo-name}
              link = f"https://{item_org.lower()}.github.io/{name}" if item_org else ""

              out.append({
                  "Course": title,
                  "id": course_id,
                  "level": level,
                  "School": school,
                  "area": area,
                  "status": status,
                  "completed_on": completed_on,
                  "link": link,
              })

          out = sorted(out, key=lambda x: ((x.get("id") or "ZZZZ"), (x.get("Course") or "")))

          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(
              yaml.safe_dump(out, sort_keys=False, allow_unicode=True),
              encoding="utf-8"
          )
          print(f"[ok] wrote {dst} ({len(out)} items)")
          PY

      - name: Commit changes (if any)
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ env.DEST_FILE }}"
          git commit -m "Update files"
          git push